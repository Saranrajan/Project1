name: Build Winlator ARM64 APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build upstream Winlator APK (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v4

      - name: Checkout upstream Winlator app source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          path: winlator-app
          fetch-depth: 1

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK/CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;24.0.8215888' \
            'cmake;3.22.1'

      - name: Initialize upstream submodules
        working-directory: winlator-app
        run: git submodule update --init --recursive

      - name: Build debug APK
        working-directory: winlator-app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}/24.0.8215888
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-arm64-debug-apk
          path: winlator-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: winlator-arm64-mapping
          path: winlator-app/app/build/outputs/mapping/debug/*
          if-no-files-found: ignore
          retention-days: 14
