name: Build Winlator ARM64 Modified APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build modified Winlator APK (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout experiment repository
        uses: actions/checkout@v4

      - name: Checkout upstream Winlator app source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          path: winlator-app
          fetch-depth: 1

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Configure hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/24.0.8215888" >> "$GITHUB_ENV"
          echo "PATH=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;24.0.8215888' \
            'cmake;3.22.1'

      - name: Initialize upstream submodules
        working-directory: winlator-app
        run: git submodule update --init --recursive

      - name: Apply Project1 ARM64 dispatcher overlay
        run: bash scripts/apply-winlator-overlay.sh

      - name: Validate overlay
        shell: bash
        run: |
          test -f winlator-app/app/src/main/java/com/winlator/xenvironment/components/NativeGuestDispatcher.java
          grep -q 'NativeGuestDispatcher.buildCommand' winlator-app/app/src/main/java/com/winlator/xenvironment/components/GuestProgramLauncherComponent.java

      - name: Build debug APK
        working-directory: winlator-app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-arm64-modified-debug-apk
          path: winlator-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: winlator-arm64-modified-mapping
          path: winlator-app/app/build/outputs/mapping/debug/*
          if-no-files-found: ignore
          retention-days: 14
